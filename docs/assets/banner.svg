<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100d"/>
      <stop offset="1" stop-color="#080705"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece3cf"/>
      <stop offset="0.5" stop-color="#dfc389"/>
      <stop offset="1" stop-color="#c9a45a"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1c"/>
      <stop offset="0.55" stop-color="#8a5a2a"/>
      <stop offset="1" stop-color="#c9873f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a45a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9a45a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" fill="url(#bg)"/>
  <ellipse cx="220" cy="330" rx="540" ry="230" fill="url(#glow)"/>
  <ellipse cx="1040" cy="30" rx="440" ry="210" fill="url(#glow)"/>

  <!-- logo mark: accent rounded square + play, as in the app icon -->
  <g transform="translate(80,92)">
    <rect x="0" y="0" width="96" height="96" rx="26" fill="#c9a45a"/>
    <path d="M34 24 v48 l40 -24 z" fill="#12100d"/>
  </g>

  <!-- wordmark -->
  <text x="204" y="168" font-size="102" font-weight="700" letter-spacing="14" fill="url(#gold)">tivi</text>
  <text x="210" y="216" font-size="24" fill="#968b72">a small, native, resizable video player &#8212; Hi&#8209;Fi warm.</text>

  <!-- theme dots -->
  <g transform="translate(212,252)">
    <circle cx="9"   cy="9" r="9" fill="#c9a45a"/>
    <circle cx="37"  cy="9" r="9" fill="#60a0d2"/>
    <circle cx="65"  cy="9" r="9" fill="#6eb97d"/>
    <circle cx="93"  cy="9" r="9" fill="#d66e78"/>
    <circle cx="121" cy="9" r="9" fill="#a8aab6"/>
    <text x="146" y="15" font-size="17" fill="#6d6450">FFmpeg &#183; GPU decode &#183; libass subtitles &#183; five themes</text>
  </g>

  <!-- player window mockup -->
  <g transform="translate(852,52)">
    <rect x="0" y="0" width="352" height="236" rx="14" fill="#0c0a08" stroke="#3c362a" stroke-width="1.5"/>
    <!-- top bar -->
    <circle cx="22" cy="20" r="8" fill="none" stroke="#968b72" stroke-width="1.6"/>
    <path d="M22 16 v8 M18 20 h8" stroke="#968b72" stroke-width="1.6"/>
    <text x="40" y="25" font-size="14" font-weight="600" letter-spacing="3" fill="#c9a45a">tivi</text>
    <text x="86" y="25" font-size="12" fill="#6d6450">Sintel Trailer</text>
    <text x="332" y="25" font-size="12" fill="#6d6450" text-anchor="middle">&#10005;</text>

    <!-- letterboxed picture -->
    <rect x="14" y="46" width="324" height="132" fill="url(#sunset)"/>
    <circle cx="258" cy="86" r="17" fill="#ecd9a0" opacity="0.9"/>
    <path d="M14 178 l110 -44 66 22 82 -34 66 28 v28 h-324 z" fill="#241a10" opacity="0.85"/>
    <!-- subtitle -->
    <rect x="112" y="152" width="128" height="15" rx="4" fill="#080705" opacity="0.55"/>
    <text x="176" y="164" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">subtitles, crisp</text>

    <!-- seek bar -->
    <rect x="14" y="192" width="324" height="5" rx="2.5" fill="#3c362a"/>
    <rect x="14" y="192" width="212" height="5" rx="2.5" fill="#c9a45a"/>
    <circle cx="226" cy="194.5" r="6" fill="#ece3cf"/>

    <!-- transport -->
    <circle cx="176" cy="217" r="13" fill="#c9a45a"/>
    <rect x="171.5" y="211.5" width="3.4" height="11" rx="1.2" fill="#12100d"/>
    <rect x="177.5" y="211.5" width="3.4" height="11" rx="1.2" fill="#12100d"/>
    <path d="M140 211 v12 M141 217 l10 -6 v12 z" stroke="#968b72" stroke-width="0" fill="#968b72"/>
    <path d="M212 211 v12 M201 217 l10 -6 v12 z" transform="scale(-1,1) translate(-413,0)" fill="#968b72"/>
    <text x="318" y="222" font-size="13" fill="#968b72">&#9881;</text>
  </g>
</svg>
