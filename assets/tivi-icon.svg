<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2013"/>
      <stop offset="1" stop-color="#0c0906"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dca6"/>
      <stop offset="0.5" stop-color="#d9b877"/>
      <stop offset="1" stop-color="#b98f47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.74" r="0.7">
      <stop offset="0" stop-color="#c9a45a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c9a45a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS-style squircle -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- rabbit-ear antennae -->
  <g stroke="url(#gold)" stroke-width="11" stroke-linecap="round">
    <line x1="108" y1="98" x2="77" y2="47"/>
    <line x1="148" y1="98" x2="179" y2="47"/>
  </g>
  <circle cx="77"  cy="47" r="10" fill="#f0dca6"/>
  <circle cx="179" cy="47" r="10" fill="#f0dca6"/>

  <!-- TV body -->
  <rect x="48" y="96" width="160" height="118" rx="24" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <rect x="62" y="110" width="132" height="90" rx="13" fill="#c9a45a" fill-opacity="0.10"/>

  <!-- play (visually centered in the 62..194 screen: bbox center ~131, a light
       optical right-shift past the 128 midpoint, centroid just left of it) -->
  <path d="M105 130 v50 a6.5 6.5 0 0 0 9.8 5.6 l44 -25 a6.5 6.5 0 0 0 0 -11.2 l-44 -25 a6.5 6.5 0 0 0 -9.8 5.6 z" fill="url(#gold)"/>
</svg>
